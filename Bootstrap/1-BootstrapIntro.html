<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Intro</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <h1 class="text-center text-success my-5">Hello Bootstrap</h1>

    <h1>Bootstrap Buttons</h1>
    <button class="btn btn-danger">Red Button</button>
    <button class="btn btn-success">Green Button</button>
    <button class="btn btn-info">SkyBlue Button</button>
    <button class="btn btn-secondary">Grey Button</button>
    <button class="btn btn-warning">Yellow Button</button>
    <button class="btn btn-light">White Button</button>
    <button class="btn btn-primary">Royal Blue Button</button>

    <h1>Bootstrap Outline Buttons</h1>
    <button type="button" class="btn btn-outline-danger btn-lg">Red Button</button>
    <button type="button" class="btn btn-outline-success shadow">Green Button</button>
    <button type="button" class="btn btn-outline-info">SkyBlue Button</button>
    <button type="button" class="btn btn-outline-secondary">Grey Button</button>
    <button type="button" class="btn btn-outline-warning">Yellow Button</button>
    <button type="button" class="btn btn-outline-light">White Button</button>
    <button type="button" class="btn btn-outline-primary">Royal Blue Button</button>

    <br>

    <h1>Disabled Buttons</h1>
    <button type="button" class="btn btn-primary" disabled>Primary button</button>
    <button type="button" class="btn btn-secondary" disabled>Button</button>
    <button type="button" class="btn btn-outline-primary" disabled>Primary button</button>
    <button type="button" class="btn btn-outline-secondary" disabled>Button</button>

    

    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
