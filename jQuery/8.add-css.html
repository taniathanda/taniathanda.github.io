<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add css</title>
</head>
<body>
    <p class="day">This day is super Monday</p>
    <button id="addCssID">Add Css</button> 

    <script src="jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function(){
            $('#addCssID').click(function(){
                $('.day').css({'color':'white', 'background-color':'black', 'font-size': '30px'});
            }) 
        })

        
    </script>
</body>
</html>
